name: Plugin CI

# Reusable workflow for the out-of-tree OBS plugin. Drop this file (or call it
# via workflow_call) from the plugin repository. All versions come from
# ci/plugin-ci/versions.env so jobs stay in sync.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: "Plugin version override (MAJOR.MINOR.PATCH)"
        required: false
        type: string

permissions:
  contents: read

env:
  CI_DIR: ci/plugin-ci

jobs:
  build:
    name: Build, smoke test and package
    runs-on: ubuntu-24.04
    outputs:
      plugin_version: ${{ steps.version.outputs.plugin_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Load pinned versions
        run: |
          set -a
          . "${CI_DIR}/versions.env"
          set +a
          {
            echo "OBS_VERSION=${OBS_VERSION}"
            echo "LIBOBS_PACKAGE_VERSION=${LIBOBS_PACKAGE_VERSION}"
            echo "OBS_APPIMAGE_URL=${OBS_APPIMAGE_URL}"
            echo "OBS_APPIMAGE_SHA256=${OBS_APPIMAGE_SHA256}"
            echo "APPIMAGETOOL_URL=${APPIMAGETOOL_URL}"
            echo "APPIMAGETOOL_SHA256=${APPIMAGETOOL_SHA256}"
            echo "UBUNTU_VERSION=${UBUNTU_VERSION}"
            echo "UBUNTU_IMAGE_DIGEST=${UBUNTU_IMAGE_DIGEST}"
          } >> "${GITHUB_ENV}"

      - name: Resolve plugin version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.plugin_version }}" ]; then
            PV="${{ github.event.inputs.plugin_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PV="${GITHUB_REF_NAME#v}"
          else
            PV="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          # CMake project() only accepts numeric x.y.z; any pre-release tag
          # is passed separately as PLUGIN_VERSION_SUFFIX.
          PV_BASE="${PV%%-*}"
          PV_SUFFIX="${PV#*-}"
          if [ "${PV_BASE}" = "${PV_SUFFIX}" ]; then
            PV_SUFFIX=""
          fi
          echo "plugin_version=${PV}" >> "${GITHUB_OUTPUT}"
          echo "PLUGIN_VERSION=${PV}" >> "${GITHUB_ENV}"
          echo "PLUGIN_VERSION_BASE=${PV_BASE}" >> "${GITHUB_ENV}"
          echo "PLUGIN_VERSION_SUFFIX=${PV_SUFFIX}" >> "${GITHUB_ENV}"

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        run: |
          docker build \
            --file "${CI_DIR}/docker/Dockerfile" \
            --build-arg UBUNTU_VERSION="${UBUNTU_VERSION}" \
            --build-arg UBUNTU_IMAGE_DIGEST="${UBUNTU_IMAGE_DIGEST}" \
            --build-arg LIBOBS_PACKAGE_VERSION="${LIBOBS_PACKAGE_VERSION}" \
            --build-arg OBS_VERSION="${OBS_VERSION}" \
            --build-arg PLUGIN_VERSION="${PLUGIN_VERSION_BASE}" \
            --build-arg PLUGIN_VERSION_SUFFIX="${PLUGIN_VERSION_SUFFIX}" \
            --build-arg APPIMAGETOOL_URL="${APPIMAGETOOL_URL}" \
            --build-arg APPIMAGETOOL_SHA256="${APPIMAGETOOL_SHA256}" \
            --tag obs-plugin-builder .

      - name: Download and verify base OBS AppImage
        run: |
          mkdir -p build/base
          curl -fL --retry 3 -o build/base/OBS.AppImage "${OBS_APPIMAGE_URL}"
          echo "${OBS_APPIMAGE_SHA256}  build/base/OBS.AppImage" | sha256sum -c -

      - name: Run pipeline (build, smoke test, deb, AppImage)
        run: |
          docker run --rm --privileged \
            -e OBS_MIN_PACKAGE_VERSION="${OBS_VERSION%.*}.0" \
            -e OUTPUT_DIR=/work/dist \
            -v "${PWD}/build/base:/work/base:ro" \
            -v "${PWD}/build/dist:/work/dist" \
            -e OBS_APPIMAGE=/work/base/OBS.AppImage \
            obs-plugin-builder \
            bash /work/scripts/ci-entrypoint.sh

      - name: Verify deb metadata
        run: |
          DEB=$(find build/dist -name '*.deb' -print -quit)
          dpkg-deb --info "${DEB}"
          dpkg-deb --contents "${DEB}"

      - name: Verify AppImage
        run: |
          APPIMAGE=$(find build/dist -name '*.AppImage' -print -quit)
          chmod +x "${APPIMAGE}"
          # --appimage-version is a best-effort sanity check; some runtimes
          # need FUSE which the runner may not expose.
          "${APPIMAGE}" --appimage-version 2>/dev/null || true
          (cd build/dist && sha256sum -c SHA256SUMS)

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-${{ steps.version.outputs.plugin_version }}
          path: build/dist/
          retention-days: 14

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.deb
            build/dist/*.AppImage
            build/dist/SHA256SUMS
